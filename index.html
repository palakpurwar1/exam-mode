<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Minute Revision — CuriousJr</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<script>
tailwind.config={
  theme:{
    extend:{
      colors:{
        'cj-bg':'#FFFBF2','cj-card':'#FFFFFF','cj-accent':'#E05C14',
        'cj-soft':'#FFF0E3','cj-ink':'#2C1E16','cj-muted':'#8C7A6B',
        'cj-border':'#EFE4D4','cj-green':'#64A338','cj-teal':'#0F7A80'
      }
    }
  }
}
</script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ── Reset + font ───────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;color-scheme:light only}
button{cursor:pointer;font-family:inherit;border:none;background:none}
button:focus-visible{outline:2px solid #E05C14;outline-offset:2px;border-radius:4px}
a{color:#E05C14;text-decoration:none}

/* ── JS-generated element bridge classes ──────────────────────────────── */
/* Grade chips */
.chip{flex-shrink:0;padding:6px 16px;border-radius:100px;font-size:13px;font-weight:800;background:#fff;border:2px solid #EFE4D4;color:#2C1E16;transition:all .13s;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:#E05C14;color:#E05C14}
.chip.active{background:#E05C14;color:#fff;border-color:#E05C14;box-shadow:0 2px 10px rgba(224,92,20,.28)}

/* Board toggle */
.board-btn{flex:1;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:800;color:#8C7A6B;transition:all .14s;text-align:center;white-space:nowrap;cursor:pointer}
.board-btn.active{background:#E05C14;color:#fff;box-shadow:0 1px 6px rgba(224,92,20,.28)}

/* Subject pills */
.subj-btn{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:10px;font-size:12px;font-weight:800;background:#fff;border:2px solid #EFE4D4;color:#8C7A6B;transition:all .13s;cursor:pointer}
.subj-btn.active{background:#FFF0E3;color:#E05C14;border-color:#E05C14}
.si{font-size:15px;line-height:1}

/* Chapter cards */
.ch-card{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid #EFE4D4;border-radius:18px;padding:18px 16px;transition:box-shadow .15s,border-color .15s}
.ch-card:hover{box-shadow:0 4px 20px rgba(44,30,22,.10);border-color:#E8D5C0}
.ch-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.ch-body{flex:1;min-width:0}
.ch-name{font-size:15px;font-weight:800;color:#2C1E16;line-height:1.35;margin-bottom:10px}
.ch-meta{font-size:11.5px;color:#8C7A6B;font-weight:600;margin-bottom:8px}
.ch-btns{display:flex;gap:6px;flex-wrap:wrap}

/* Open Notes — outline style */
.pdf-btn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #E05C14;color:#E05C14;background:transparent;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:800;text-decoration:none;transition:background .13s,box-shadow .13s;white-space:nowrap}
.pdf-btn:hover{background:#FFF0E3;box-shadow:0 2px 8px rgba(224,92,20,.16)}
.pdf-btn svg{width:13px;height:13px;flex-shrink:0}
.pdf-btn.part2{border-color:#0F7A80;color:#0F7A80}
.pdf-btn.part2:hover{background:#E6F6F7}

/* Share button */
.share-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:none;border:1.5px solid #EFE4D4;color:#8C7A6B;cursor:pointer;transition:all .13s;flex-shrink:0;align-self:center}
.share-btn:hover{border-color:#E05C14;color:#E05C14;background:#FFF0E3}
.share-btn svg{width:13px;height:13px}

/* Search */
.search-wrap{overflow:hidden;max-height:0;transition:max-height .2s,padding .2s}
.search-wrap.open{max-height:64px}
.search-inner{display:flex;align-items:center;background:#fff;border:1.5px solid #EFE4D4;border-radius:12px;padding:0 12px;gap:8px}
.search-icon-inner{width:15px;height:15px;color:#8C7A6B;flex-shrink:0}
.search-input{flex:1;border:none;background:none;padding:10px 0;font-size:13px;font-weight:600;color:#2C1E16;outline:none;font-family:'Nunito',sans-serif}
.search-input::placeholder{color:#C5B4A4}
.search-clear{font-size:18px;color:#8C7A6B;display:none;line-height:1}
.search-clear:hover{color:#E05C14}
.search-toggle{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:none;border:1.5px solid #EFE4D4;color:#8C7A6B;cursor:pointer;transition:all .13s}
.search-toggle:hover,.search-toggle.active{border-color:#E05C14;color:#E05C14;background:#FFF0E3}
.search-toggle svg{width:15px;height:15px}

/* Empty state */
.empty{text-align:center;padding:40px 20px}
.ei{font-size:40px;margin-bottom:10px}
.eh{font-size:16px;font-weight:800;color:#2C1E16;margin-bottom:6px}
.es{font-size:13px;color:#8C7A6B;font-weight:600;line-height:1.5}

/* Cards grid */
.ch-list{padding:0 16px 120px;display:grid;gap:14px}

/* Floating mentor pill */
.mentor-float{position:fixed;bottom:72px;right:max(16px,calc((100vw - 480px)/2 + 16px));display:flex;align-items:center;gap:8px;background:#E05C14;color:#fff;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:800;box-shadow:0 4px 20px rgba(224,92,20,.45);border:none;cursor:pointer;white-space:nowrap;transition:background .14s,box-shadow .14s;z-index:900;text-decoration:none}.mentor-float:hover{background:#C44E0E;box-shadow:0 6px 24px rgba(224,92,20,.55)}

.mentor-float:active{transform:translateX(-50%) translateY(0)}

/* Responsive grid */
@media(min-width:700px){
  body{font-size:15px}
  #shell{max-width:768px}
  .ch-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 48px 120px}
  .chips-scroll,.subj-scroll{flex-wrap:wrap;overflow:visible}
  .mentor-float{right:max(48px,calc((100vw - 768px)/2 + 48px))}
}
@media(min-width:1060px){
  #shell{max-width:1140px}
  .ch-list{grid-template-columns:repeat(3,minmax(0,1fr));padding:0 48px 120px}
  .mentor-float{right:max(48px,calc((100vw - 1140px)/2 + 48px))}
}
@media(hover:none){
  .ch-card:hover{box-shadow:none;border-color:#EFE4D4}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

  <!-- ── Hero ──────────────────────────────────────────────────────────── -->

// Class chips
const gradesInData = [...new Set(DATA.map(r=>r.gradeNum))].sort((a,b)=>+a-+b);

/* ── URL query params ──────────────────────────────────────────────
   ?class=5  (aliases: grade, c)   → locks to Class 5, hides the class picker
   ?board=ICSE (alias: b)          → preselects board
   No class param → default view with the class picker visible.          */
const QP = new URLSearchParams(location.search);
const qpRaw = QP.get('class') ?? QP.get('grade') ?? QP.get('c');
const qpClass = qpRaw ? String(qpRaw).replace(/\D/g,'') : '';
const classLocked = gradesInData.includes(qpClass);
if(classLocked) grade = qpClass;

const qpBoard = (QP.get('board') ?? QP.get('b') ?? '').toUpperCase();
if(qpBoard==='CBSE'||qpBoard==='ICSE'){
  if(DATA.some(r=>r.gradeNum===grade&&r.board===qpBoard)) board=qpBoard;
}

const chipsEl = document.getElementById('classChips');
if(classLocked) document.getElementById('classCtrl').style.display='none';
gradesInData.forEach(g=>{
  const btn=document.createElement('button');
  btn.className='chip'+(g===grade?' active':'');
  btn.textContent='Class '+g;
  btn.onclick=()=>{grade=g;chipsEl.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');buildBoardToggle();buildSubjectTabs();render();};
  chipsEl.appendChild(btn);
});

// Subject tabs — rebuilt every time board or grade changes
const subjEl=document.getElementById('subjectTabs');

function buildBoardToggle(){
  const toggleEl=document.getElementById('boardToggle');
  const boardCtrl=document.getElementById('boardCtrl');
  const hasCBSE=DATA.some(r=>r.gradeNum===grade&&(r.board==='BOTH'||r.board==='CBSE'));
  const hasICSE=DATA.some(r=>r.gradeNum===grade&&(r.board==='BOTH'||r.board==='ICSE'));
  const bothBoards=hasCBSE&&hasICSE;
  boardCtrl.style.display=bothBoards?'':'none';
  if(!bothBoards){
    board=hasCBSE?'CBSE':'ICSE';
  }
  toggleEl.querySelectorAll('.board-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.board===board);
  });
}

function buildSubjectTabs(){
  const active=DATA.filter(r=>r.gradeNum===grade&&(r.board==='BOTH'||r.board===board));
  const hasSubj=new Set(active.map(r=>r.subject));
  if(!hasSubj.has(subject)){
    const alt=ALL_SUBJ.find(s=>hasSubj.has(s));
    if(alt) subject=alt;
  }
  subjEl.innerHTML='';
  ALL_SUBJ.filter(s=>hasSubj.has(s)).forEach(s=>{
    const meta=SUBJ_META[s]||{icon:'📘',label:s};
    const btn=document.createElement('button');
    btn.className='subj-btn'+(s===subject?' active':'');
    btn.dataset.subj=s;
    btn.innerHTML='<span class="si">'+meta.icon+'</span>'+meta.label;
    btn.onclick=()=>{subject=s;subjEl.querySelectorAll('.subj-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();};
    subjEl.appendChild(btn);
  });
}

let _toastTimer;
function showToast(msg, anchor){
  const old=document.getElementById('toast');
  if(old&&old.parentNode) old.parentNode.removeChild(old);
  const t=document.createElement('div');
  t.id='toast';
  t.textContent=msg;
  t.style.cssText='position:absolute;background:#1a1a2e;color:#fff;font-family:Nunito,sans-serif;font-size:12px;font-weight:800;padding:7px 14px;border-radius:8px;z-index:999999;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.28);pointer-events:none;opacity:0;transition:opacity .15s';
  document.body.appendChild(t);
  // Anchor above the clicked button, in document coordinates (iframe-safe)
  const r=anchor.getBoundingClientRect();
  let left=r.left+window.scrollX+r.width/2-t.offsetWidth/2;
  left=Math.max(8,Math.min(left,document.documentElement.clientWidth-t.offsetWidth-8));
  t.style.left=left+'px';
  t.style.top=(r.top+window.scrollY-t.offsetHeight-8)+'px';
  requestAnimationFrame(()=>{t.style.opacity='1'});
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{if(t.parentNode)t.parentNode.removeChild(t);},1800);
}
function canShareTray(){
  if(!navigator.share) return false;
  const ua=navigator.userAgent;
  // iPadOS reports as Macintosh, so also check for touch
  return /Mobi|Android|iPhone|iPad|iPod/i.test(ua) || (navigator.maxTouchPoints>1 && /Mac/.test(ua));
}

function copyAndToast(btn, text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly','');
  ta.style.cssText='position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;border:0;padding:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  navigator.clipboard?.writeText(text).catch(()=>{});
  showToast('Link copied!', btn);
}

function shareChapter(btn, urls, title){
  const multi = Array.isArray(urls) && urls.length > 1;
  const shareText = multi
    ? title + '\n' + urls.map((u,i) => 'Pt '+(i+1)+': '+u).join('\n')
    : title;
  const shareUrl = Array.isArray(urls) ? urls[0] : urls;
  const copyText = multi
    ? title + '\n' + urls.map((u,i) => 'Pt '+(i+1)+': '+u).join('\n')
    : shareUrl;

  if(canShareTray()){
    try{
      navigator.share({title:'Revise '+title+' — CuriousJr Notes', text: shareText + (multi ? '' : ':'), url: multi ? undefined : shareUrl})
        .catch(err=>{ if(err&&err.name!=='AbortError') copyAndToast(btn, copyText); });
      return;
    }catch(e){}
  }
  copyAndToast(btn, copyText);
}

    [/fract/,{bg:'#F3E8FF',em:'⅓'}],[/decimal/,{bg:'#FFFBEB',em:'🔟'}],
    [/ratio|proportion/,{bg:'#FEF9C3',em:'⚖️'}],[/alg|express|letter|term/,{bg:'#EEF2FF',em:'🔡'}],
    [/angle|line|parallel|geom|shape|3d|quad|tri/,{bg:'#ECFDF5',em:'📐'}],
    [/data|graph|stat/,{bg:'#F0F9FF',em:'📊'}],[/integer|negative/,{bg:'#EEF2FF',em:'🔢'}],
    [/power|square|cube/,{bg:'#F5F3FF',em:'⚡'}],[/percent/,{bg:'#FFFBEB',em:'💯'}],
    [/area|perim/,{bg:'#F0FDF4',em:'📏'}],[/time|speed/,{bg:'#FEF2F2',em:'⏱️'}],
    [/transport|travel|road|rail/,{bg:'#EFF6FF',em:'🚂'}],
    [/food|nutrition|meal|health/,{bg:'#FFF7ED',em:'🥗'}],
    [/plant|tree|leaf|flower|pollina/,{bg:'#DCFCE7',em:'🌱'}],
    [/animal|adapt|habitat|wild|bird|insect/,{bg:'#FEF9C3',em:'🦁'}],
    [/water|river|ocean/,{bg:'#E0F2FE',em:'💧'}],
    [/earth|landform|mountain|continent/,{bg:'#ECFDF5',em:'🌍'}],
    [/body|skeleton|circulat|digest|system|teeth|bone/,{bg:'#FEE2E2',em:'🫀'}],
    [/climate|weather|season/,{bg:'#E0F2FE',em:'🌤️'}],
    [/magnet|electric|force|energy|motion|light|sound|matter|acid|metal|element|compound/,{bg:'#F5F3FF',em:'⚡'}],
    [/essay|grammar|adjec|verb|noun|prepos|conjun|tense|compos|writing/,{bg:'#FFF7ED',em:'✍️'}],
    [/history|past|ancient|story|rise|spread/,{bg:'#FEF9C3',em:'📜'}],
    [/india|heritage|diverse|citizen|communit|family/,{bg:'#FFF3E8',em:'🇮🇳'}],
    [/locat|map|globe|continent|resourc/,{bg:'#ECFDF5',em:'🗺️'}],
  ];
  for(const [pat,ic] of map) if(pat.test(t)) return ic;
  const defaults={Mathematics:{bg:'#FFF1E4',em:'📐'},EVS:{bg:'#DCFCE7',em:'🌿'},English:{bg:'#FFF7ED',em:'📖'},Physics:{bg:'#F5F3FF',em:'⚡'},Chemistry:{bg:'#FFFBEB',em:'🧪'},Biology:{bg:'#FEF9C3',em:'🧬'},SST:{bg:'#ECFDF5',em:'🌍'},Science:{bg:'#EEF2FF',em:'🔬'}};
  return defaults[subj]||{bg:'#FFF4E8',em:'📘'};
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function render(){
  const filtered=DATA.filter(r=>{
    const base=r.gradeNum===grade&&(r.board==='BOTH'||r.board===board)&&r.subject===subject;
    if(!base) return false;
    if(searchQ) return r.chapter.toLowerCase().includes(searchQ);
    return true;
  });
  const meta=SUBJ_META[subject]||{label:subject};
  document.getElementById('resultsTitle').textContent=board+' · Class '+grade+' · '+meta.label;

  const list=document.getElementById('chList');
  if(!filtered.length){
    list.innerHTML='<div class="empty"><div class="ei">🕐</div><div class="eh">Coming soon</div><div class="es">We’re preparing notes for '+board+' Class '+grade+' '+meta.label+'.<br>They’ll be ready before the exam!</div></div>';
    return;
  }

  list.innerHTML=filtered.map(r=>{
    const ic=iconFor(r.chapter,r.subject);
    const btns=r.pdfUrls.map((url,i)=>{
      const label=r.pdfUrls.length>1?(i===0?'Part 1':'Part '+(i+1)):'Open Notes';
      const cls='pdf-btn'+(i>0?' part2':'');
      return '<a href="'+esc(url)+'" target="_blank" rel="noopener" class="'+cls+'">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'+
        label+'</a>';
    }).join('');
    return '<div class="ch-card">'+
      '<div class="ch-icon" style="background:'+ic.bg+'">'+ic.em+'</div>'+
      '<div class="ch-body">'+
        '<div class="ch-name">'+esc(r.chapter)+'</div>'+
        '<div class="ch-btns">'+btns+'</div>'+
      '</div>'+
      shareBtn(r)+
    '</div>';
  }).join('');
}


buildBoardToggle();
buildSubjectTabs();
render();
</script>
